---
layout: default
---
<article class="page">
  {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
  {%- if page.title %}<h1>{{ page.title }}</h1>{% endif %}
  {%- if page.subtitle %}<p class="dek">{{ page.subtitle }}</p>{% endif %}
  {{ content }}
  {%- if page.cta %}{% include cta.html %}{% endif %}
</article>
