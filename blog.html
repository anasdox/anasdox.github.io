---
layout: default
title: Blog
permalink: /blog/
---

<h1>Blog</h1>
<p class="muted">Notes on engineering management, AI-native tooling, and shipping in the open.</p>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <span class="date">{{ post.date | date: "%B %-d, %Y" }}</span>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% else %}
    <li><p class="muted">More posts coming soon.</p></li>
  {% endfor %}
</ul>
